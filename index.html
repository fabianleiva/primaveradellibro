<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primavera del Libro — Postulación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&family=Special+Elite&family=Domine:wght@400..700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/paper-grain.jpg">
<style>
  body { margin: 0; background: #ffffff; overflow: hidden; }
  a { color: #85a5c1; }
  a:hover { color: #4d4d4d; }
  @keyframes floatUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes gentleBob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(0.8deg); } }
  @keyframes softPulse { 0%, 100% { box-shadow: 0 3px 10px rgba(77,77,77,0.1); transform: scale(1); } 50% { box-shadow: 0 8px 22px rgba(77,77,77,0.22); transform: scale(1.015); } }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes logoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes introLogo { 0% { opacity: 0; transform: scale(0.6) rotate(-10deg); } 60% { opacity: 1; transform: scale(1.08) rotate(3deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
  @keyframes introTextIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .banner-fadein { opacity: 0; animation: floatUp 0.6s ease 0.05s both; animation-play-state: paused; }
  #pageRoot.petals-go .banner-fadein { animation-play-state: running; }
  .btn-lift { display: block; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); filter: drop-shadow(0 6px 14px rgba(77,77,77,0.22)); }
  .btn-lift:hover { transform: translateY(-4px) scale(1.03); }
  .btn-pulse { display: block; animation: softPulse 3.4s ease-in-out infinite; }
  .nav-fade { opacity: 0; animation: fadeSlide 0.5s ease both; animation-play-state: paused; }
  .copy-fade { opacity: 0; animation: fadeSlide 0.6s ease 0.15s both; animation-play-state: paused; }
  .btns-fade { opacity: 0; animation: fadeSlide 0.6s ease 0.3s both; animation-play-state: paused; }
  .footer-fade { opacity: 0; animation: fadeSlide 0.6s ease 0.45s both; animation-play-state: paused; }
  #pageRoot.petals-go .nav-fade, #pageRoot.petals-go .copy-fade, #pageRoot.petals-go .btns-fade, #pageRoot.petals-go .footer-fade { animation-play-state: running; }
  .logo-idle { animation: logoSpin 14s linear infinite; transition: transform 0.35s ease; }
  .logo-idle:hover { transform: scale(1.12); }
  .intro-logo { animation: introLogo 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both paused; }
  .intro-text { animation: introTextIn 0.4s ease 0.2s both paused; }
  #introOverlay.grain-ready .intro-logo, #introOverlay.grain-ready .intro-text { animation-play-state: running; }
  .intro-cursor { animation: blinkCursor 0.9s step-end infinite; }
  .siguenos { font-family: 'Domine', serif; font-weight: 600; font-size: clamp(15px, 1.9vh, 19px); letter-spacing: 0.05em; color: #4d4d4d; text-decoration: none; transition: color 0.25s ease; }
  .siguenos:hover { color: #4d7a4f; }
  #introOverlay { position: absolute; inset: 0; z-index: 50; background: transparent; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.7s cubic-bezier(0.6, 0, 0.4, 1), opacity 0.6s ease; }
  #introOverlay.fading { opacity: 0; transform: translateY(-100%); pointer-events: none; }
  #introOverlay.hidden { display: none; }
  .logo-tooltip { position: absolute; top: calc(100% + 10px); left: 0; width: max-content; white-space: nowrap; background: #4d4d4d; color: #fff; font-family: 'Special Elite', 'Roboto Slab', serif; font-size: 13px; padding: 6px 14px; border-radius: 999px; transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none; opacity: 0; transform: translate(0, 6px); }
  .logo-wrap:hover .logo-tooltip { opacity: 1; transform: translate(0, 0); }
  .grain-img { opacity: 0; transition: opacity 0.4s ease; }
  .grain-img.loaded { opacity: 1; }
  @keyframes petalFall { 0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.5; } 90% { opacity: 0.5; } 100% { transform: translateY(110vh) translateX(40px) rotate(180deg); opacity: 0; } }
  .petal { position: absolute; top: 0; width: 10px; height: 14px; background: #c27ba8; border-radius: 0 60% 0 60%; pointer-events: none; animation: petalFall linear infinite; animation-fill-mode: backwards; animation-play-state: paused; }
  #pageRoot.petals-go .petal { animation-play-state: running; }
  .custom-cursor { position: fixed; width: 34px; height: 34px; pointer-events: none; z-index: 1000; transform: translate(-50%, -50%) scale(0.4); opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .custom-cursor.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  @media (max-width: 700px) {
    nav.nav-fade { padding: 10px 16px !important; }
    .logo-wrap { width: 66px !important; height: 66px !important; margin-left: -8px !important; }
    .logo-wrap img { width: 50px !important; height: 50px !important; }
    #contentArea { padding: 4px 2px !important; margin-top: -40px !important; gap: 8px !important; }
    .desktop-hero { display: none !important; }
    .mobile-hero { display: flex !important; }
    .copy-fade { margin-top: 12px !important; font-size: 13px !important; max-width: 92% !important; }
    #postulacion { flex-direction: row !important; align-items: center; gap: 10px !important; }
    .btn-lift { width: min(150px, 44vw) !important; }
    #pageRoot { height: 100dvh !important; }
  }
  .mobile-hero { display: none; flex-direction: column; align-items: center; gap: 0px; width: 100%; }
</style>
</head>
<body>
<div style="height: 100vh; width: 100%; background: transparent; font-family: 'Nunito Sans', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; position: relative;" id="pageRoot">

  <div id="introOverlay">
    <img src="assets/paper-grain.jpg" alt="" class="grain-img" onload="this.classList.add('loaded'); document.getElementById('introOverlay').classList.add('grain-ready'); window.__startIntro();" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none;" />
    <img src="assets/banner-main.webp" alt="Primavera del Libro" class="intro-logo" style="width: clamp(140px, 21vh, 230px); height: clamp(140px, 21vh, 230px); position: relative; z-index: 1;" />
    <div class="intro-text" style="margin-top: clamp(16px, 2.5vh, 28px); font-family: 'Special Elite', 'Roboto Slab', serif; font-size: clamp(20px, 3.2vh, 34px); color: #4d4d4d; letter-spacing: 0.02em; min-height: 1.2em; position: relative; z-index: 1;">
      <span id="typedText"></span><span class="intro-cursor">|</span>
    </div>
  </div>

  <img src="assets/paper-grain.jpg" alt="" class="grain-img" id="grainBg" onload="this.classList.add('loaded')" style="position: absolute; inset: -100px; width: calc(100% + 200px); height: calc(100% + 200px); object-fit: cover; pointer-events: none; transition: transform 0.2s ease-out;" />

  <div class="petal" style="left: 8%; background: #c27ba8; animation-duration: 14s; animation-delay: 0s;"></div>
  <div class="petal" style="left: 22%; background: #80b282; animation-duration: 18s; animation-delay: 3s;"></div>
  <div class="petal" style="left: 40%; background: #e5ba76; animation-duration: 16s; animation-delay: 6s;"></div>
  <div class="petal" style="left: 58%; background: #c76d6d; animation-duration: 20s; animation-delay: 1.5s;"></div>
  <div class="petal" style="left: 74%; background: #80b282; animation-duration: 15s; animation-delay: 8s;"></div>
  <div class="petal" style="left: 90%; background: #c27ba8; animation-duration: 19s; animation-delay: 4.5s;"></div>

  <nav class="nav-fade" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: clamp(6px, 1vw, 12px) clamp(24px, 3.2vw, 40px) clamp(10px, 1.6vw, 20px); box-sizing: border-box; flex: 0 0 auto; position: relative; z-index: 5; background: transparent; border-radius: 0 0 48px 48px;">
    <div class="logo-wrap" onmouseenter="window.__startTooltipTyping()" onmouseleave="window.__stopTooltipTyping()" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: clamp(90px, 13.4vh, 130px); height: clamp(90px, 13.4vh, 130px); margin-left: clamp(-19px, -1.9vh, -13px);">
      <img src="assets/banner-main.webp" alt="Primavera del Libro" class="logo-idle" style="width: clamp(64px, 9.5vh, 92px); height: clamp(64px, 9.5vh, 92px);" />
      <span class="logo-tooltip" id="logoTooltip"><span id="tooltipTypedText"></span><span class="intro-cursor" id="tooltipCursor" style="display:none;">|</span></span>
    </div>
    <a href="https://www.instagram.com/primaveradellibro/?hl=es" target="_blank" rel="noopener" class="siguenos" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px;" aria-label="Instagram Primavera del Libro">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="2" y="2" width="20" height="20" rx="5.5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.4" cy="6.6" r="1.05" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </nav>

  <div style="flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 1.5vh, 16px); box-sizing: border-box; padding: clamp(12px, 2.5vh, 28px) clamp(24px, 6vw, 80px); margin-top: -130px; position: relative; z-index: 1;" id="contentArea">
    <img src="assets/banner-nobg.webp" alt="15ª Primavera del Libro — Feria de Editoriales 2026" class="banner-fadein desktop-hero" style="width: 100%; max-width: 1850px; height: auto; max-height: 70vh; object-fit: contain;" />

    <div class="mobile-hero banner-fadein">
      <img src="assets/mobile-primavera-titulo.png" alt="15ª Primavera del Libro — Feria de Editoriales de Chile" style="width: 88%; max-width: 340px; height: auto;" />
      <img src="assets/mobile-estacion-mapocho.png" alt="9, 10 y 11 de octubre 2026 — Estación Mapocho, Santiago de Chile" style="width: 82%; max-width: 320px; height: auto;" />
    </div>

    <p class="copy-fade" style="font-family: 'Nunito Sans', sans-serif; font-size: clamp(13px, 1.7vh, 17px); line-height: 1.5; color: #4d4d4d; text-align: center; max-width: 640px; margin: -60px 0 0; position: relative; z-index: 2;">
      <span style="font-weight: 700; font-size: 1.15em; display: block; margin-bottom: 0.5em;">Este año la primavera cumple 15 años de vida, celebra con nosotros!</span>Postulaciones abiertas:
    </p>

    <div id="postulacion" class="btns-fade" style="display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(16px, 2.4vw, 28px);">
      <a href="https://forms.gle/HAUE8S8koLNeEySc9" target="_blank" rel="noopener" class="btn-lift" onclick="return window.__confetti(event, this.href)" style="width: min(260px, 34vw); border-radius: 8px; overflow: hidden;">
        <div class="btn-pulse" style="border-radius: 8px; overflow: hidden;">
          <img src="assets/btn-editoriales-v2.webp" alt="Postulación Editoriales" style="width: 100%; display: block;" />
        </div>
      </a>
      <a href="https://forms.gle/7MYgvZmM7CvwrJZe8" target="_blank" rel="noopener" class="btn-lift" onclick="return window.__confetti(event, this.href)" style="width: min(260px, 34vw); border-radius: 8px; overflow: hidden;">
        <div class="btn-pulse" style="border-radius: 8px; overflow: hidden; animation-delay: 1.2s;">
          <img src="assets/btn-imprentas-v2.webp" alt="Postulación Imprentas" style="width: 100%; display: block;" />
        </div>
      </a>
    </div>

    <p class="footer-fade" style="font-family: 'Nunito Sans', sans-serif; font-size: clamp(11px, 1.2vh, 13px); color: #999999; margin: 0; text-align: center;">
      Cada botón te lleva a un formulario de Google.
    </p>
  </div>

  <div class="custom-cursor" id="customCursor">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="#c27ba8">
      <circle cx="12" cy="6.5" r="3.4"/><circle cx="17.5" cy="12" r="3.4"/><circle cx="12" cy="17.5" r="3.4"/><circle cx="6.5" cy="12" r="3.4"/><circle cx="12" cy="12" r="2.6" fill="#e5ba76"/>
    </svg>
  </div>
</div>

<script>
  var introText = '¡Ya llegó la primavera!';
  var el = document.getElementById('typedText');
  var started = false;
  window.__startIntro = function () {
    if (started) return;
    started = true;
    var i = 0;
    setTimeout(function typeChar() {
      if (i <= introText.length) {
        el.textContent = introText.slice(0, i);
        i++;
        setTimeout(typeChar, 65);
      }
    }, 500);
    var totalTypingTime = 500 + introText.length * 65;
    setTimeout(function () {
      var overlay = document.getElementById('introOverlay');
      overlay.classList.add('fading');
      document.getElementById('pageRoot').classList.add('petals-go');
      setTimeout(function () { overlay.classList.add('hidden'); }, 700);
    }, totalTypingTime + 800);
  };

  var tooltipText = '¡Nos vemos en la feria!';
  var tooltipTimers = [];
  window.__startTooltipTyping = function () {
    tooltipTimers.forEach(clearTimeout);
    tooltipTimers = [];
    var t = document.getElementById('tooltipTypedText');
    var cursor = document.getElementById('tooltipCursor');
    t.textContent = '';
    cursor.style.display = 'inline';
    tooltipText.split('').forEach(function (_, i) {
      tooltipTimers.push(setTimeout(function () { t.textContent = tooltipText.slice(0, i + 1); }, i * 55));
    });
  };
  window.__stopTooltipTyping = function () {
    tooltipTimers.forEach(clearTimeout);
    tooltipTimers = [];
    document.getElementById('tooltipTypedText').textContent = '';
    document.getElementById('tooltipCursor').style.display = 'none';
  };

  var grainBg = document.getElementById('grainBg');
  document.addEventListener('mousemove', function (e) {
    var x = (e.clientX / window.innerWidth - 0.5) * 48;
    var y = (e.clientY / window.innerHeight - 0.5) * 48;
    grainBg.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
  });

  window.__confetti = function (e, url) {    e.preventDefault();
    var colors = ['#80b282', '#c27ba8', '#c76d6d', '#e5ba76', '#85a5c1'];
    var rect = e.currentTarget.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    for (var i = 0; i < 26; i++) {
      var piece = document.createElement('div');
      var size = 6 + Math.random() * 6;
      piece.style.cssText = 'position:fixed;left:' + cx + 'px;top:' + cy + 'px;width:' + size + 'px;height:' + size + 'px;background:' + colors[i % colors.length] + ';border-radius:' + (Math.random() > 0.5 ? '50%' : '2px') + ';pointer-events:none;z-index:999;';
      document.body.appendChild(piece);
      var angle = Math.random() * Math.PI * 2;
      var dist = 80 + Math.random() * 140;
      var dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist - 40;
      var rot = Math.random() * 720 - 360;
      piece.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg)', opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(0.25, 0.8, 0.4, 1)' });
      setTimeout(function (p) { return function () { p.remove(); }; }(piece), 1400);
    }
    setTimeout(function () { window.open(url, '_blank', 'noopener'); }, 550);
    return false;
  };

  var cursorEl = document.getElementById('customCursor');
  document.addEventListener('mousemove', function (e) {
    cursorEl.style.left = e.clientX + 'px';
    cursorEl.style.top = e.clientY + 'px';
  });
  document.querySelectorAll('.btn-lift').forEach(function (btn) {
    btn.addEventListener('mouseenter', function () { cursorEl.classList.add('active'); });
    btn.addEventListener('mouseleave', function () { cursorEl.classList.remove('active'); });
  });
</script>
</body>
</html>
