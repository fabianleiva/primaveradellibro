name: Deploy to DreamHost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to DreamHost via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.DREAMHOST_SFTP_USER }}
          server: ${{ secrets.DREAMHOST_SFTP_HOST }}
          password: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './dist/*'
          remote_path: '/home/primaveradellibro/primaveradellibro.cl'
          delete_remote_files: false
